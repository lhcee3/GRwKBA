services:
  neo4j:
    image: neo4j:latest
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - ./neo4j-data:/data
    environment:
      NEO4J_AUTH: neo4j/password123
      
  app:
    build: .
    ports:
      - "8501:8501"
      - "8000:8000"
    volumes:
      - ./app:/app
      - ./docs:/docs
    depends_on:
      - neo4j
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password123
      GROQ_API_KEY: ${GROQ_API_KEY}
    command: sh -c "streamlit run streamlit_app.py --server.port=8501 --server.address=0.0.0.0 & uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
